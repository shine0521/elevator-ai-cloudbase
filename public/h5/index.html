<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1677ff">
  <title>特安助</title>
  <script src="/vue.js"></script>
  <link rel="stylesheet" href="/h5/css/app.css">
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <!-- 顶部栏 -->
      <header class="app-bar" v-if="!hideBar">
        <button class="bar-back" v-if="canBack" @click="goBack" aria-label="返回">&#8249;</button>
        <h1 class="bar-title">{{title}}</h1>
        <div class="bar-right">
          <button class="bar-action" v-if="barAction.show" @click="onBarActionClick">{{barAction.text}}</button>
        </div>
      </header>

      <!-- 下拉刷新指示器 -->
      <div class="ptr-indicator" v-if="ptrPulling" style="position:relative;z-index:10;margin-top:-2px;">
        <span class="ptr-spin" v-if="ptrText.indexOf('刷新')>=0"></span>
        {{ptrText}}
      </div>

      <!-- 内容区 -->
      <main
        class="app-body"
        :class="{noPad: hideBar}"
        @scroll.passive="onBodyScroll"
        @touchstart.passive="onTouchStart"
        @touchmove.passive="onTouchMove"
        @touchend.passive="onTouchEnd">
        <component :is="view" :query="query"></component>
      </main>

      <!-- 底部 TabBar -->
      <nav class="app-tab" :class="{elevated: tabElevated}" v-if="showTab">
        <a class="tab" :class="{on: tab==='home'}" href="#/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>工作台</span>
        </a>
        <a class="tab" :class="{on: tab==='check'}" href="#/check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>检查</span>
        </a>
        <a class="tab" :class="{on: tab==='message'}" href="#/message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>消息</span>
        </a>
        <a class="tab" :class="{on: tab==='profile'}" href="#/profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </a>
      </nav>
    </div>

    <!-- 全局吐司 -->
    <div class="toast" v-if="toastVisible">{{toastMsg}}</div>

    <!-- 全局 Loading -->
    <div v-if="loading" style="position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
      <div style="width:36px;height:36px;border:3px solid #e5e6eb;border-top-color:#1677ff;border-radius:50%;animation:spin .8s linear infinite;"></div>
      <span style="font-size:14px;color:#666;">加载中...</span>
    </div>

    <!-- 错误边界 -->
    <div v-if="appError.show" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#fff;border-radius:12px;padding:24px;max-width:320px;width:100%;text-align:center;">
        <div style="font-size:32px;margin-bottom:12px;">&#9888;&#65039;</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:8px;">出错了</div>
        <div style="font-size:13px;color:#666;margin-bottom:16px;">{{appError.msg}}</div>
        <button @click="reloadPage" style="background:#1677ff;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;">重试</button>
      </div>
    </div>
  </div>

  <!-- 框架层 -->
  <script src="/h5/js/store.js"></script>
  <script src="/h5/js/api.js"></script>
  <script src="/h5/js/utils.js"></script>
  <script src="/h5/js/field.js"></script>
  <!-- 页面层（顺序无关，router 在 app.js 前注册即可） -->
  <script src="/h5/js/pages/login.js"></script>
  <script src="/h5/js/pages/home.js"></script>
  <script src="/h5/js/pages/check.js"></script>
  <script src="/h5/js/pages/daily.js"></script>
  <script src="/h5/js/pages/daily_form.js"></script>
  <script src="/h5/js/pages/weekly.js"></script>
  <script src="/h5/js/pages/weekly_form.js"></script>
  <script src="/h5/js/pages/monthly.js"></script>
  <script src="/h5/js/pages/monthly_form.js"></script>
  <script src="/h5/js/pages/hazard.js"></script>
  <script src="/h5/js/pages/hazard_form.js"></script>
  <script src="/h5/js/pages/work_order.js"></script>
  <script src="/h5/js/pages/work_order_detail.js"></script>
  <script src="/h5/js/pages/device_scan.js"></script>
  <script src="/h5/js/pages/device_detail.js"></script>
  <script src="/h5/js/pages/emergency.js"></script>
  <script src="/h5/js/pages/emergency_form.js"></script>
  <script src="/h5/js/pages/approval.js"></script>
  <script src="/h5/js/pages/approval_detail.js"></script>
  <script src="/h5/js/pages/message.js"></script>
  <script src="/h5/js/pages/profile.js"></script>
  <script src="/h5/js/pages/record.js"></script>
  <!-- 路由 + 启动 -->
  <script src="/h5/js/router.js"></script>
  <script src="/h5/js/app.js"></script>
</body>
</html>
